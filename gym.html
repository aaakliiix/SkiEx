<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hot Lobito: Gym Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    /* Consistent Branding */
    :root {
      --bg: #0b0d0f; /* Dark theme */
      --card-bg: #16191d;
      --text-main: #e0e0e0;
      --text-dim: #909090;
      --accent: #ff4d4d; 
      --accent-muted: #3d1a1a;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Inter', sans-serif;
      --radius: 12px;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-style: italic;
      margin: 0;
      letter-spacing: -1px;
    }

    header img {
      width: 80px;
      margin: 20px 0;
      filter: drop-shadow(0 0 10px rgba(255, 77, 77, 0.3));
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #day-label {
      font-family: var(--font-serif);
      font-size: 1.4rem;
    }

    /* Day Selector Tabs */
    .day-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .tab-btn {
      flex: 1;
      background: var(--card-bg);
      color: var(--text-dim);
      border: 1px solid #333;
      padding: 10px 8px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent-muted);
      color: var(--accent);
      border-color: var(--accent);
    }

    .category h3 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: var(--accent);
      margin-top: 20px;
      border-left: 3px solid var(--accent);
      padding-left: 15px;
    }

    .category p.focus-subtitle {
      margin: -10px 0 20px 18px;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Exercise Card Layout */
    .exercise {
      background: var(--card-bg);
      margin-bottom: 16px;
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      transition: all 0.3s;
    }

    .exercise:hover {
      border-color: var(--accent-muted);
    }

    .exercise-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exercise-info h4 {
      margin: 0;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .exercise-info p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .tip-btn {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid #333;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tip-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .timer-btn {
      background: var(--accent-muted);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Tooltip / Guidance Drawer Style */
    .tooltip-box {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #2a2e35;
      font-size: 0.85rem;
      color: #b0b8c0;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 15px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .tooltip-box strong {
      color: var(--accent);
    }

    .alt-swap {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #ffd166;
    }

    #notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--accent);
      color: white;
      padding: 15px 25px;
      border-radius: var(--radius);
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hot Lobito: Gym Edition</h1>
    <img src="ExWolf.png" alt="Logo">
    <p style="font-size: 0.8rem; letter-spacing: 3px; color: var(--text-dim);">LEVELING UP FOR HOT LESBIAN SUMMER</p>
  </header>

  <div class="nav">
    <a href="index.html">← Back to Home Base</a>
    <span id="day-label">Gym Routine</span>
    <span style="width: 80px;"></span>
  </div>

  <!-- DAY SELECTOR TABS -->
  <div class="day-tabs">
    <button class="tab-btn active" onclick="switchDay('day1')">Day 1: Legs & Core</button>
    <button class="tab-btn" onclick="switchDay('day2')">Day 2: Upper & Arms</button>
    <button class="tab-btn" onclick="switchDay('day3')">Day 3: Full & Cardio</button>
  </div>

  <div id="notification"></div>
  <div class="exercise-list" id="gym-container" style="max-width: 700px; margin: 0 auto;"></div>

  <script>
   // GYM SPECIFIC DATABASE - EXPANDED 60-MIN ROUTINE WITH TARGET MUSCLES
const masterGymSchedule = {
    day1: {
      title: "Day 1: Glutes, Lower Body & Heavy Core",
      focus: "Machine Glutes & Legs + Heavy Core (~60 Min)",
      exercises: [
        { name: "Incline Treadmill Warm-Up", detail: "Cardio - 10 Mins (8-10% Incline)", muscles: "Glutes, Calves & Warm-Up", duration: 10, tip: "Press through heels to activate glutes.", alt: "Elliptical or Bike." },
        { name: "Leg Press Machine", detail: "Machine - 3x10 (Slow 3s down)", muscles: "Quads & Glutes", duration: 3, tip: "Feet placed high and wide on board to hit glutes.", alt: "Plan B: DB Goblet Squats or DB Lunges." },
        { name: "Seated Leg Curl Machine", detail: "Machine - 3x10-12", muscles: "Hamstrings & Glute Fold", duration: 3, tip: "Squeeze back of legs at full bend.", alt: "Plan B: DB RDLs / Romanian Deadlifts." },
        { name: "Hip Abductor Machine (Outward)", detail: "Machine - 3x15 (Push OUTWARDS)", muscles: "Outer Glutes & Upper Hip", duration: 3, tip: "Lean slightly forward, hold squeeze 1 sec at widest point.", alt: "Plan B: Standing Cable Abduction or Resistance Band Walks." },
        { name: "Seated Ab Crunch Machine", detail: "Machine - 3x15", muscles: "Upper Core", duration: 3, tip: "Squeeze ribs toward hips using core, not arms.", alt: "Plan B: Kneeling Cable Crunches or DB Mat Crunches." },
        { name: "Captain's Chair Leg Raises", detail: "Tower - 3xMax", muscles: "Lower Abs", duration: 2, tip: "Lift knees toward chest smoothly without swinging.", alt: "Plan B: Lying Reverse Crunches on Mat." },
        { name: "Post-Workout Hip & Hamstring Stretch", detail: "Pigeon Pose + Hip Flexor - 3 mins", muscles: "Lower Body Recovery", duration: 3, tip: "Hold each stretch 45-60s with deep breaths.", alt: "Seated Butterfly Stretch." }
      ]
    },
    day2: {
      title: "Day 2: Showy Arms, 3D Shoulders & Pull-Up Path",
      focus: "Pull-Up Machine, Biceps, Triceps & Shoulder Machines (~60 Min)",
      exercises: [
        { name: "Incline Treadmill Walk", detail: "Warm-Up - 8 Mins", muscles: "Cardio Warm-Up", duration: 8, tip: "Brisk walk to get blood flowing.", alt: "Stationary Bike." },
        { name: "Assisted Pull-Up Machine", detail: "Machine - 3x8-10", muscles: "Lats, Upper Back & Pull-Up Power", duration: 3, tip: "Drive elbows down to hips to pull chest to bar.", alt: "Plan B: Lat Pulldown Machine or Heavy Resistance Bands." },
        { name: "Underhand Lat Pulldown Machine", detail: "Machine/Cable - 3x10", muscles: "Lats & Bicep Power", duration: 3, tip: "Reverse grip (palms facing you). Pull to upper chest.", alt: "Plan B: Single-Arm DB Rows." },
        { name: "Overhead Shoulder Press Machine", detail: "Machine - 3x10", muscles: "Shoulders & Upper Arms", duration: 3, tip: "Press straight overhead without arching lower back.", alt: "Plan B: Seated DB Overhead Press." },
        { name: "Cable Lateral Raise Tower", detail: "Cable - 3x12 per side", muscles: "Side Shoulder Cap (3D Width)", duration: 3, tip: "Lead upward with elbows to shoulder height.", alt: "Plan B: DB Lateral Raises." },
        { name: "Cable Bicep Curl Tower", detail: "Bar or Rope - 3x12", muscles: "Biceps (Front Arm Sculpt)", duration: 3, tip: "Keep elbows glued to ribs, squeeze at top.", alt: "Plan B: DB Bicep / Hammer Curls." },
        { name: "Cable Tricep Pushdown Tower", detail: "Rope Attachment - 3x12", muscles: "Triceps (Back Arm Definition)", duration: 3, tip: "Spread rope ends outward at bottom.", alt: "Plan B: DB Overhead Tricep Extension." },
        { name: "Upper Body & Lat Stretch", detail: "Lat Wall Hang + Cross-Body Shoulder - 3 mins", muscles: "Shoulder & Upper Back Recovery", duration: 3, tip: "Hold stretch to prevent shoulder stiffness.", alt: "Doorway Chest/Shoulder Stretch." }
      ]
    },
    day3: {
      title: "Day 3: Full Body, Arm Blitz & Core Stability",
      focus: "Compound Machines, Bicep/Tricep Blitz & Core (~60 Min)",
      exercises: [
        { name: "Hack Squat or Leg Press Machine", detail: "Machine - 3x10", muscles: "Quads & Glutes", duration: 3, tip: "Controlled downward tempo, push through heels.", alt: "Plan B: DB Goblet Squats." },
        { name: "Seated Row Machine", detail: "Machine/Cable - 3x10", muscles: "Mid-Back & Posture", duration: 3, tip: "Pull handle toward belly, squeeze shoulder blades.", alt: "Plan B: DB Chest-Supported Rows." },
        { name: "Pec Deck Chest Fly Machine", detail: "Machine - 3x12", muscles: "Chest Definition & Shoulder Mobility", duration: 3, tip: "Slight bend in elbows, squeeze arms inward at center.", alt: "Plan B: Flat DB Bench Flyes." },
        { name: "Cable Hammer Curls", detail: "Rope Attachment - 3x12", muscles: "Biceps & Forearm Thickness", duration: 3, tip: "Palms facing each other, pull toward chin.", alt: "Plan B: Standing DB Hammer Curls." },
        { name: "Overhead Cable Tricep Extension", detail: "Rope Attachment - 3x12", muscles: "Triceps (Long Head)", duration: 3, tip: "Extend rope forward over head, lock out elbows.", alt: "Plan B: Single Heavy DB Overhead Extension." },
        { name: "Cable Pallof Press / Torso Rotation Machine", detail: "Cable/Machine - 3x12 per side", muscles: "Obliques & Core Stability", duration: 3, tip: "Brace core tight, move smoothly without rushing.", alt: "Plan B: Weighted Russian Twists on Mat." },
        { name: "Treadmill HIIT Finisher", detail: "Cardio Intervals - 12 Mins", muscles: "Cardio & Endurance", duration: 12, tip: "1 min walk @ 3mph, 30s power incline walk/sprint.", alt: "Stationary Bike Sprints." },
        { name: "Full Body Post-Workout Stretch", detail: "Downward Dog to Cobra + Child's Pose - 3 mins", muscles: "Spine, Abs & Full Body", duration: 3, tip: "Lengthen spine and relax deep core.", alt: "Cat-Cow Stretch." }
      ]
    }
  };

    let activeDay = 'day1';

    function toggleTip(index) {
      const tipBox = document.getElementById(`tip-${index}`);
      if (tipBox.style.display === 'block') {
        tipBox.style.display = 'none';
      } else {
        tipBox.style.display = 'block';
      }
    }

    function switchDay(dayKey) {
      activeDay = dayKey;
      
      // Update Tab Styles
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach((btn, index) => {
        if ((dayKey === 'day1' && index === 0) || 
            (dayKey === 'day2' && index === 1) || 
            (dayKey === 'day3' && index === 2)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderGym();
    }

    function renderGym() {
      const container = document.getElementById('gym-container');
      container.innerHTML = '';
      
      const currentSchedule = masterGymSchedule[activeDay];

      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'category';
      sectionDiv.innerHTML = `
        <h3>${currentSchedule.title}</h3>
        <p class="focus-subtitle">Focus: ${currentSchedule.focus}</p>
      `;
      
      currentSchedule.exercises.forEach((ex, idx) => {
        const card = document.createElement('div');
        card.className = 'exercise';
        card.innerHTML = `
            <div class="exercise-main">
              <div class="exercise-info">
                <h4>${ex.name}</h4>
                <span class="muscle-tag">🎯 ${ex.muscles}</span>
                <p>${ex.detail}</p>
              </div>
              <div class="actions">
                <button class="tip-btn" onclick="toggleTip(${idx})">💡 Form Tip</button>
                <button class="timer-btn">Start Sets</button>
              </div>
            </div>
            <div class="tooltip-box" id="tip-${idx}">
              <div><strong>Machine Setup & Form:</strong> ${ex.tip}</div>
              <div class="alt-swap"><strong>🔄 Machine Busy? Swap with:</strong> ${ex.alt}</div>
            </div>
          `;
        sectionDiv.appendChild(card);
      });

      container.appendChild(sectionDiv);
    }

    // Initial Render
    renderGym();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
