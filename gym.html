<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hot Lobito: Gym Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    /* Consistent Branding */
    :root {
      --bg: #0b0d0f; /* Dark theme */
      --card-bg: #16191d;
      --text-main: #e0e0e0;
      --text-dim: #909090;
      --accent: #ff4d4d; 
      --accent-muted: #3d1a1a;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Inter', sans-serif;
      --radius: 12px;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-style: italic;
      margin: 0;
      letter-spacing: -1px;
    }

    header img {
      width: 80px;
      margin: 20px 0;
      filter: drop-shadow(0 0 10px rgba(255, 77, 77, 0.3));
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #day-label {
      font-family: var(--font-serif);
      font-size: 1.4rem;
    }

    /* Day Selector Tabs */
    .day-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .tab-btn {
      flex: 1;
      background: var(--card-bg);
      color: var(--text-dim);
      border: 1px solid #333;
      padding: 10px 8px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent-muted);
      color: var(--accent);
      border-color: var(--accent);
    }

    .category h3 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: var(--accent);
      margin-top: 20px;
      border-left: 3px solid var(--accent);
      padding-left: 15px;
    }

    .category p.focus-subtitle {
      margin: -10px 0 20px 18px;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Exercise Card Layout */
    .exercise {
      background: var(--card-bg);
      margin-bottom: 16px;
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      transition: all 0.3s;
    }

    .exercise:hover {
      border-color: var(--accent-muted);
    }

    .exercise-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exercise-info h4 {
      margin: 0;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .exercise-info p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .tip-btn {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid #333;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tip-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .timer-btn {
      background: var(--accent-muted);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Tooltip / Guidance Drawer Style */
    .tooltip-box {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #2a2e35;
      font-size: 0.85rem;
      color: #b0b8c0;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 15px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .tooltip-box strong {
      color: var(--accent);
    }

    .alt-swap {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #ffd166;
    }

    #notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--accent);
      color: white;
      padding: 15px 25px;
      border-radius: var(--radius);
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hot Lobito: Gym Edition</h1>
    <img src="ExWolf.png" alt="Logo">
    <p style="font-size: 0.8rem; letter-spacing: 3px; color: var(--text-dim);">LEVELING UP FOR HOT LESBIAN SUMMER</p>
  </header>

  <div class="nav">
    <a href="index.html">← Back to Home Base</a>
    <span id="day-label">Gym Routine</span>
    <span style="width: 80px;"></span>
  </div>

  <!-- DAY SELECTOR TABS -->
  <div class="day-tabs">
    <button class="tab-btn active" onclick="switchDay('day1')">Day 1: Legs & Core</button>
    <button class="tab-btn" onclick="switchDay('day2')">Day 2: Upper & Arms</button>
    <button class="tab-btn" onclick="switchDay('day3')">Day 3: Full & Cardio</button>
  </div>

  <div id="notification"></div>
  <div class="exercise-list" id="gym-container" style="max-width: 700px; margin: 0 auto;"></div>

  <script>
    // GYM SPECIFIC DATABASE - 3-DAY SPLIT WITH MACHINE SWAPS
    const masterGymSchedule = {
      day1: {
        title: "Day 1: Lower Body & Heavy Core",
        focus: "Leg Press, Glutes & Abs",
        exercises: [
          { 
            name: "Incline Treadmill Warm-Up", 
            detail: "Cardio - 10 Minutes (8-10% Incline)", 
            duration: 10,
            tip: "Speed 2.8 - 3.2 mph. Walk with intent, press through your heels to activate glutes, and avoid holding onto handles.",
            alt: "Elliptical or Stationary Bike."
          },
          { 
            name: "Leg Press", 
            detail: "Machine - 3x10 (Slow 3s eccentric)", 
            duration: 3,
            tip: "Feet shoulder-width, placed high on the board (targets glutes/hamstrings). Never lock knees straight at the top.",
            alt: "Hack Squat Machine or Heavy Dumbbell Goblet Squats."
          },
          { 
            name: "Seated Leg Curl", 
            detail: "Machine - 3x12", 
            duration: 3,
            tip: "Lock thigh pad down snug. Bend knees smoothly to pull pad down toward your seat.",
            alt: "Lying Leg Curl Machine or Romanian Deadlifts (RDLs) with dumbbells."
          },
          { 
            name: "Hip Abductor Machine", 
            detail: "Machine - 3x15", 
            duration: 3,
            tip: "Sit tall or lean slightly forward. Press knees outward against the pads and hold for 1 second.",
            alt: "Cable Hip Abductions (using ankle strap on cable tower) or Side-Lying Clamshells on a mat."
          },
          { 
            name: "Cable Crunches", 
            detail: "Kneeling Rope - 3x15 (Heavy)", 
            duration: 3,
            tip: "Kneel facing cable tower. Curl ribs to hips like a ball using abs, not pulling down with arms.",
            alt: "Machine Ab Crunch or Decline Weighted Crunches."
          },
          { 
            name: "Hanging Leg Raises", 
            detail: "Captain's Chair - 3xMax", 
            duration: 2,
            tip: "Keep back flat against pad. Lift knees toward chest in a smooth, controlled motion without swinging.",
            alt: "Lying Reverse Crunches on a bench or Vertical Knee Raises on dip bars."
          }
        ]
      },

      day2: {
        title: "Day 2: Upper Body & Arm Sculpt",
        focus: "Chest, Back, Shoulders, Biceps & Triceps",
        exercises: [
          { 
            name: "Incline Treadmill Walk", 
            detail: "Warm-Up - 8 Minutes (Incline 8-10%)", 
            duration: 8,
            tip: "Speed at 2.8 - 3.2 mph. Keep shoulders back and walk briskly without holding onto the handles.",
            alt: "Elliptical or Stationary Bike."
          },
          { 
            name: "Machine Chest Press", 
            detail: "Machine - 3x10", 
            duration: 3,
            tip: "Adjust seat so handles sit at mid-chest level. Drive forward while keeping shoulder blades squeezed back.",
            alt: "Flat Dumbbell Bench Press or Cable Chest Flyes."
          },
          { 
            name: "Lat Pulldowns", 
            detail: "Wide Grip Cable - 3x10", 
            duration: 3,
            tip: "Lock thigh pad over legs. Pull bar down toward upper chest while leaning back slightly.",
            alt: "Assisted Pull-Up Machine or Seated High Cable Rows."
          },
          { 
            name: "Cable Lateral Raises", 
            detail: "Single Arm - 3x12 per side", 
            duration: 3,
            tip: "Set pulley to lowest height. Raise arm smoothly out to side up to shoulder height.",
            alt: "Dumbbell Lateral Raises or Lateral Raise Machine."
          },
          { 
            name: "Cable Tricep Pushdowns", 
            detail: "Rope Attachment - 3x12", 
            duration: 3,
            tip: "Pin elbows against ribs. Push rope down and spread the ends apart at the bottom.",
            alt: "Overhead Dumbbell Extension or Tricep Dip Machine."
          },
          { 
            name: "Cable Bicep Curls", 
            detail: "Straight Bar or Rope - 3x12", 
            duration: 3,
            tip: "Pulley at lowest setting. Stand tall, keep elbows locked at your sides, and curl up smoothly.",
            alt: "Preacher Curl Machine or Dumbbell Hammer Curls."
          }
        ]
      },

      day3: {
        title: "Day 3: Full Body & Cardio Blitz",
        focus: "Total Body Compounds, Arms, Core & Treadmill HIIT",
        exercises: [
          { 
            name: "Leg Press or Hack Squat", 
            detail: "Machine - 3x10", 
            duration: 3,
            tip: "Drive through heels. Maintain controlled tempo down and explosive push up.",
            alt: "Dumbbell Goblet Squats or Smith Machine Squats."
          },
          { 
            name: "Seated Cable Rows", 
            detail: "Cable Tower - 3x10", 
            duration: 3,
            tip: "Sit tall with feet on pads. Pull handle toward belly button, squeezing shoulder blades together.",
            alt: "Chest-Supported Dumbbell Rows or T-Bar Row Machine."
          },
          { 
            name: "Seated DB Shoulder Press", 
            detail: "Dumbbells or Machine - 3x10", 
            duration: 3,
            tip: "Keep elbows slightly angled forward (not flared way out). Press straight up overhead.",
            alt: "Shoulder Press Machine or Cable Overhead Press."
          },
          { 
            name: "Cable Arm Superset", 
            detail: "3x12 Curls + 3x12 Pushdowns", 
            duration: 3,
            tip: "Do 12 Tricep Pushdowns, immediately switch attachment or grip to do 12 Bicep Curls before resting.",
            alt: "EZ-Bar Curls superset with Bench Dips."
          },
          { 
            name: "Cable Crunches", 
            detail: "Core - 3x15", 
            duration: 2,
            tip: "Focus on maximum abdominal contraction rather than moving fast.",
            alt: "Hanging Knee Raises or Captain's Chair Leg Raises."
          },
          { 
            name: "Treadmill HIIT Finisher", 
            detail: "Cardio Intervals - 12-15 Minutes", 
            duration: 15,
            tip: "1 min walk recovery @ 3 mph, 30s power incline walk/sprint @ 6-8% incline. Repeat for 8-10 rounds.",
            alt: "Stationary Bike Interval Sprints (30s hard / 30s easy)."
          }
        ]
      }
    };

    let activeDay = 'day1';

    function toggleTip(index) {
      const tipBox = document.getElementById(`tip-${index}`);
      if (tipBox.style.display === 'block') {
        tipBox.style.display = 'none';
      } else {
        tipBox.style.display = 'block';
      }
    }

    function switchDay(dayKey) {
      activeDay = dayKey;
      
      // Update Tab Styles
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach((btn, index) => {
        if ((dayKey === 'day1' && index === 0) || 
            (dayKey === 'day2' && index === 1) || 
            (dayKey === 'day3' && index === 2)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderGym();
    }

    function renderGym() {
      const container = document.getElementById('gym-container');
      container.innerHTML = '';
      
      const currentSchedule = masterGymSchedule[activeDay];

      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'category';
      sectionDiv.innerHTML = `
        <h3>${currentSchedule.title}</h3>
        <p class="focus-subtitle">Focus: ${currentSchedule.focus}</p>
      `;
      
      currentSchedule.exercises.forEach((ex, idx) => {
        const card = document.createElement('div');
        card.className = 'exercise';
        card.innerHTML = `
          <div class="exercise-main">
            <div class="exercise-info">
              <h4>${ex.name}</h4>
              <p>${ex.detail}</p>
            </div>
            <div class="actions">
              <button class="tip-btn" onclick="toggleTip(${idx})">💡 Form Tip</button>
              <button class="timer-btn">Start Sets</button>
            </div>
          </div>
          <div class="tooltip-box" id="tip-${idx}">
            <div><strong>Machine Setup & Form:</strong> ${ex.tip}</div>
            <div class="alt-swap"><strong>🔄 Machine Busy? Swap with:</strong> ${ex.alt}</div>
          </div>
        `;
        sectionDiv.appendChild(card);
      });

      container.appendChild(sectionDiv);
    }

    // Initial Render
    renderGym();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
