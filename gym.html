<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hot Lobito: Gym Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    /* Consistent Branding */
    :root {
      --bg: #0b0d0f; /* Dark theme */
      --card-bg: #16191d;
      --text-main: #e0e0e0;
      --text-dim: #909090;
      --accent: #ff4d4d; 
      --accent-muted: #3d1a1a;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Inter', sans-serif;
      --radius: 12px;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-style: italic;
      margin: 0;
      letter-spacing: -1px;
    }

    header img {
      width: 80px;
      margin: 20px 0;
      filter: drop-shadow(0 0 10px rgba(255, 77, 77, 0.3));
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #day-label {
      font-family: var(--font-serif);
      font-size: 1.4rem;
    }

    /* Day Selector Tabs */
    .day-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .tab-btn {
      flex: 1;
      background: var(--card-bg);
      color: var(--text-dim);
      border: 1px solid #333;
      padding: 10px 8px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent-muted);
      color: var(--accent);
      border-color: var(--accent);
    }

    .category h3 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: var(--accent);
      margin-top: 20px;
      border-left: 3px solid var(--accent);
      padding-left: 15px;
    }

    .category p.focus-subtitle {
      margin: -10px 0 20px 18px;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Exercise Card Layout */
    .exercise {
      background: var(--card-bg);
      margin-bottom: 16px;
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      transition: all 0.3s;
    }

    .exercise:hover {
      border-color: var(--accent-muted);
    }

    .exercise-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exercise-info h4 {
      margin: 0;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .exercise-info p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .tip-btn {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid #333;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tip-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .timer-btn {
      background: var(--accent-muted);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Tooltip / Guidance Drawer Style */
    .tooltip-box {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #2a2e35;
      font-size: 0.85rem;
      color: #b0b8c0;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 15px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .tooltip-box strong {
      color: var(--accent);
    }

    .alt-swap {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #ffd166;
    }

    #notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--accent);
      color: white;
      padding: 15px 25px;
      border-radius: var(--radius);
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hot Lobito: Gym Edition</h1>
    <img src="ExWolf.png" alt="Logo">
    <p style="font-size: 0.8rem; letter-spacing: 3px; color: var(--text-dim);">LEVELING UP FOR HOT LESBIAN SUMMER</p>
  </header>

  <div class="nav">
    <a href="index.html">← Back to Home Base</a>
    <span id="day-label">Gym Routine</span>
    <span style="width: 80px;"></span>
  </div>

  <!-- DAY SELECTOR TABS -->
  <div class="day-tabs">
    <button class="tab-btn active" onclick="switchDay('day1')">Day 1: Legs & Core</button>
    <button class="tab-btn" onclick="switchDay('day2')">Day 2: Upper & Arms</button>
    <button class="tab-btn" onclick="switchDay('day3')">Day 3: Full & Cardio</button>
  </div>

  <div id="notification"></div>
  <div class="exercise-list" id="gym-container" style="max-width: 700px; margin: 0 auto;"></div>

  <script>
   // GYM SPECIFIC DATABASE - EXPANDED 60-MIN ROUTINE WITH TARGET MUSCLES
    const masterGymSchedule = {
      day1: {
        title: "Day 1: Lower Body, Glutes & Heavy Core",
        focus: "Leg Press, RDLs, Glutes & Abs (~60 Min)",
        exercises: [
          { name: "Incline Treadmill Warm-Up", detail: "Cardio - 10 Minutes (8-10% Incline)", muscles: "Glutes, Calves & Warm-Up", duration: 10, tip: "Speed 2.8 - 3.2 mph. Press through heels to activate glutes, avoid holding handles.", alt: "Elliptical or Stationary Bike." },
          { name: "Leg Press", detail: "Machine - 3x10 (Slow 3s eccentric)", muscles: "Quads, Glutes & Hamstrings", duration: 3, tip: "Feet high on board for glutes/hamstrings. Never lock knees straight.", alt: "Hack Squat Machine or Heavy DB Goblet Squats." },
          { name: "Dumbbell RDLs", detail: "Dumbbells - 3x10-12", muscles: "Hamstrings & Lower Glutes", duration: 3, tip: "Hinge at hips, keep dumbbells close to shins, squeeze glutes at the top.", alt: "Seated or Lying Leg Curl Machine." },
          { name: "Seated Leg Curl", detail: "Machine - 3x12", muscles: "Hamstrings", duration: 3, tip: "Lock thigh pad down snug. Bend knees smoothly toward seat.", alt: "Dumbbell Hamstring Curls on Flat Bench." },
          { name: "Hip Abductor Machine", detail: "Machine - 3x15", muscles: "Gluteus Medius & Outer Hips", duration: 3, tip: "Lean slightly forward, press knees outward and hold 1 sec.", alt: "Standing Cable Ankle Abductions or Band Walks." },
          { name: "Cable Crunches", detail: "Kneeling Rope - 3x15", muscles: "Upper Abs", duration: 3, tip: "Curl ribs to hips using abs, avoid pulling down with arms.", alt: "Machine Ab Crunch or Weighted Decline Crunches." },
          { name: "Hanging Leg Raises", detail: "Captain's Chair - 3xMax", muscles: "Lower Abs & Hip Flexors", duration: 2, tip: "Flat back against pad. Lift knees smoothly without swinging.", alt: "Lying Reverse Crunches or Dip Bar Knee Raises." }
        ]
      },
      day2: {
        title: "Day 2: Upper Body, 3D Shoulders & Arm Sculpt",
        focus: "Chest, Lats, Dedicated Shoulders, Biceps & Triceps (~60 Min)",
        exercises: [
          { name: "Incline Treadmill Walk", detail: "Warm-Up - 8 Minutes (Incline 8-10%)", muscles: "Calves & Cardio Warm-Up", duration: 8, tip: "Speed 2.8 - 3.2 mph. Brisk walk without holding handles.", alt: "Stationary Bike or Elliptical." },
          { name: "Machine Chest Press", detail: "Machine - 3x10", muscles: "Chest & Front Shoulders", duration: 3, tip: "Handles at mid-chest level. Drive forward, keep shoulders back.", alt: "Flat Dumbbell Bench Press or Push-ups." },
          { name: "Lat Pulldowns", detail: "Wide Grip Cable - 3x10", muscles: "Lats & Upper Back", duration: 3, tip: "Pull bar down to upper chest while leaning back slightly.", alt: "Assisted Pull-Up Machine or High Cable Rows." },
          { name: "Seated DB Shoulder Press", detail: "Dumbbells - 3x10", muscles: "Front & Side Shoulders", duration: 3, tip: "Elbows angled slightly forward. Press straight up overhead.", alt: "Shoulder Press Machine or Arnold Press." },
          { name: "Cable Lateral Raises", detail: "Single Arm - 3x12 per side", muscles: "Side Shoulders (Width & Cap)", duration: 3, tip: "Pulley low. Lead with elbow up to shoulder height.", alt: "Standing Dumbbell Lateral Raises." },
          { name: "Face Pulls / Rear Delt Cable Flyes", detail: "Rope Attachment - 3x15", muscles: "Rear Shoulders (3D Shape)", duration: 3, tip: "Pulley at eye level. Pull rope toward forehead, flare elbows out.", alt: "Bent-Over DB Rear Delt Flyes on Bench." },
          { name: "Cable Tricep Pushdowns", detail: "Rope Attachment - 3x12", muscles: "Triceps (Back of Arm)", duration: 3, tip: "Pin elbows to ribs. Push down and spread rope ends apart.", alt: "Overhead DB Extension or Bench Dips." },
          { name: "Cable Bicep Curls", detail: "Straight Bar/Rope - 3x12", muscles: "Biceps (Front of Arm)", duration: 3, tip: "Elbows locked at sides, curl up smoothly.", alt: "Dumbbell Hammer Curls or Preacher Machine." }
        ]
      },
      day3: {
        title: "Day 3: Full Body, Arm Blitz & Cardio",
        focus: "Compounds, Chest Flyes, Arm Superset & HIIT (~60 Min)",
        exercises: [
          { name: "Leg Press or Hack Squat", detail: "Machine - 3x10", muscles: "Quads & Glutes", duration: 3, tip: "Drive through heels, controlled on the way down.", alt: "Dumbbell Goblet Squats or Bulgarian Split Squats." },
          { name: "Seated Cable Rows", detail: "Cable Tower - 3x10", muscles: "Mid-Back, Lats & Upper Back", duration: 3, tip: "Sit tall, pull handle to belly button, squeeze shoulder blades.", alt: "Chest-Supported DB Rows or T-Bar Row." },
          { name: "Pec Deck or Cable Flyes", detail: "Machine/Cable - 3x12", muscles: "Chest Stretch & Isolation", duration: 3, tip: "Slight bend in elbows. Hug a wide tree, squeeze chest at center.", alt: "Flat Dumbbell Chest Flyes." },
          { name: "Dumbbell Hammer Curls", detail: "Dumbbells - 3x12", muscles: "Biceps & Forearm Thickness", duration: 3, tip: "Palms facing each other. Curl up without swinging shoulders.", alt: "Rope Cable Curls." },
          { name: "Overhead DB Tricep Extension", detail: "Single Dumbbell - 3x12", muscles: "Triceps (Long Head)", duration: 3, tip: "Hold DB overhead with both hands, lower behind head, press up.", alt: "Overhead Cable Tricep Extension." },
          { name: "Cable Crunches", detail: "Core - 3x15", muscles: "Abs & Core", duration: 2, tip: "Focus on maximum abdominal contraction.", alt: "Hanging Knee Raises or Ab Wheel." },
          { name: "Treadmill HIIT Finisher", detail: "Cardio Intervals - 12-15 Mins", muscles: "Cardio & Endurance", duration: 15, tip: "1 min walk recovery @ 3 mph, 30s power incline walk/sprint @ 6-8%.", alt: "Stationary Bike Interval Sprints." }
        ]
      }
    };

    let activeDay = 'day1';

    function toggleTip(index) {
      const tipBox = document.getElementById(`tip-${index}`);
      if (tipBox.style.display === 'block') {
        tipBox.style.display = 'none';
      } else {
        tipBox.style.display = 'block';
      }
    }

    function switchDay(dayKey) {
      activeDay = dayKey;
      
      // Update Tab Styles
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach((btn, index) => {
        if ((dayKey === 'day1' && index === 0) || 
            (dayKey === 'day2' && index === 1) || 
            (dayKey === 'day3' && index === 2)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderGym();
    }

    function renderGym() {
      const container = document.getElementById('gym-container');
      container.innerHTML = '';
      
      const currentSchedule = masterGymSchedule[activeDay];

      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'category';
      sectionDiv.innerHTML = `
        <h3>${currentSchedule.title}</h3>
        <p class="focus-subtitle">Focus: ${currentSchedule.focus}</p>
      `;
      
      currentSchedule.exercises.forEach((ex, idx) => {
        const card = document.createElement('div');
        card.className = 'exercise';
        card.innerHTML = `
            <div class="exercise-main">
              <div class="exercise-info">
                <h4>${ex.name}</h4>
                <span class="muscle-tag">🎯 ${ex.muscles}</span>
                <p>${ex.detail}</p>
              </div>
              <div class="actions">
                <button class="tip-btn" onclick="toggleTip(${idx})">💡 Form Tip</button>
                <button class="timer-btn">Start Sets</button>
              </div>
            </div>
            <div class="tooltip-box" id="tip-${idx}">
              <div><strong>Machine Setup & Form:</strong> ${ex.tip}</div>
              <div class="alt-swap"><strong>🔄 Machine Busy? Swap with:</strong> ${ex.alt}</div>
            </div>
          `;
        sectionDiv.appendChild(card);
      });

      container.appendChild(sectionDiv);
    }

    // Initial Render
    renderGym();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
