<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hot Lobito: Gym w/ Her</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0d0f;
      --card-bg: #16191d;
      --text-main: #e0e0e0;
      --text-dim: #909090;
      --accent: #ff4d4d; 
      --accent-muted: #3d1a1a;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Inter', sans-serif;
      --radius: 12px;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-style: italic;
      margin: 0;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 5px;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #day-label {
      font-family: var(--font-serif);
      font-size: 1.4rem;
    }

    /* Day Selector Tabs */
    .day-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .tab-btn {
      flex: 1 1 45%;
      background: var(--card-bg);
      color: var(--text-dim);
      border: 1px solid #333;
      padding: 10px 8px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent-muted);
      color: var(--accent);
      border-color: var(--accent);
    }

    .category h3 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: var(--accent);
      margin-top: 20px;
      border-left: 3px solid var(--accent);
      padding-left: 15px;
    }

    .category p.focus-subtitle {
      margin: -10px 0 20px 18px;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Exercise Card Layout */
    .exercise {
      background: var(--card-bg);
      margin-bottom: 16px;
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      transition: all 0.3s;
    }

    .exercise:hover {
      border-color: var(--accent-muted);
    }

    .exercise-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exercise-info h4 {
      margin: 0;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .exercise-info p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .tip-btn {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid #333;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tip-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tooltip-box {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #2a2e35;
      font-size: 0.85rem;
      color: #b0b8c0;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 15px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .tooltip-box strong {
      color: var(--accent);
    }

    .dual-notes {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #ffd166;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hot Lobito: Gym w/ Her</h1>
    <p class="subtitle">Duo Workouts & Shared Stations</p>
  </header>

  <div class="nav">
    <a href="index.html">← Home Base</a>
    <span id="day-label">Shared Sessions</span>
    <span style="width: 80px;"></span>
  </div>

  <!-- DAY SELECTOR TABS -->
  <div class="day-tabs">
    <button class="tab-btn active" onclick="switchDay('mon_thu')">Mon/Thu: Glutes & Legs</button>
    <button class="tab-btn" onclick="switchDay('tue')">Tue: Upper & Sculpt</button>
    <button class="tab-btn" onclick="switchDay('wed_fri')">Wed/Fri: Full Body & Cardio</button>
  </div>

  <div class="exercise-list" id="gym-container" style="max-width: 700px; margin: 0 auto;"></div>

  <script>
    // SHARED WORKOUT DATABASE
    const sharedSchedule = {
      mon_thu: {
        title: "Glutes + Legs & Core (Mon/Thu)",
        focus: "Her: Glute Focus | You: Heavy Legs & Core",
        exercises: [
          { 
            name: "Incline Treadmill Walk", 
            detail: "Warm-Up - 10 Minutes (8-10% Incline)", 
            tip: "Walk side-by-side at 2.8 - 3.2 mph. Keep hips square and drive through heels to fire up the posterior chain.",
            dual: "👯 Both walk together; great for catching up before lifting."
          },
          { 
            name: "Leg Press Station", 
            detail: "Machine - 3x10", 
            tip: "Her: Feet high & wide for maximum glute stretch. You: Mid/standard foot placement for quads & legs.",
            dual: "👯 Share 1 machine! Alternate sets while re-racking plates."
          },
          { 
            name: "Hip Thrust Station", 
            detail: "Machine or Barbell - 3x10", 
            tip: "Drive through heels and lock core down at the top. Squeeze glutes for 1 second at full extension.",
            dual: "👯 Her main glute movement; great hamstrings/posterior builder for you."
          },
          { 
            name: "Step-Up Station", 
            detail: "Step-Up Machine or Bench - 3x10 per leg", 
            tip: "Lean slightly forward and push through front heel without bouncing off bottom foot.",
            dual: "👯 Use adjacent step boxes or alternate on the step-up machine."
          },
          { 
            name: "Cable Tower Superset", 
            detail: "3 Sets - Cable Crunches & Kickbacks", 
            tip: "Person A uses top rope attachment for Cable Crunches; Person B uses ankle strap on bottom pulley for Kickbacks/Pull-throughs.",
            dual: "👯 Use both pulleys on one dual-cable tower simultaneously!"
          },
          { 
            name: "Captain's Chair / Hanging Raises", 
            detail: "Core Finisher - 3xMax", 
            tip: "Control the movement without swinging. Pull knees up to chest using lower abs.",
            dual: "👯 You hit hanging raises while she finishes glutes or joins core."
          }
        ]
      },

      tue: {
        title: "Upper Body & Arm Sculpt (Tue)",
        focus: "Chest, Lats, Shoulders & Arms",
        exercises: [
          { 
            name: "Incline Treadmill Walk", 
            detail: "Warm-Up - 8 Minutes", 
            tip: "Brisk walk to get blood flowing before upper body compound lifts.",
            dual: "👯 Warm up together."
          },
          { 
            name: "Machine Chest Press", 
            detail: "Machine - 3x10", 
            tip: "Keep shoulder blades retracted and elbows angled slightly below shoulder line.",
            dual: "👯 Swap seat height/pin weight easily between sets."
          },
          { 
            name: "Lat Pulldowns", 
            detail: "Cable Tower - 3x10", 
            tip: "Pull bar down toward collarbone, driving elbows toward your back pockets.",
            dual: "👯 Share cable station; alternate sets."
          },
          { 
            name: "Cable Lateral Raises", 
            detail: "Single Arm - 3x12", 
            tip: "Raise arm out to side with a slight bend in the elbow up to shoulder height.",
            dual: "👯 Work side-by-side using opposite pulleys."
          },
          { 
            name: "Cable Arm Superset", 
            detail: "3x12 Bicep Curls + 3x12 Tricep Pushdowns", 
            tip: "Keep elbows pinned to torso; move only forearms.",
            dual: "👯 Alternate arms/triceps on dual cable handles."
          }
        ]
      },

      wed_fri: {
        title: "Full Body & Treadmill HIIT (Wed/Fri)",
        focus: "Total Body Compounds & Cardio Finisher",
        exercises: [
          { 
            name: "Seated Cable Rows", 
            detail: "Cable Tower - 3x10", 
            tip: "Pull handle into navel while keeping chest upright.",
            dual: "👯 Share station or use side-by-side cable rows."
          },
          { 
            name: "Dumbbell Shoulder Press", 
            detail: "Seated Bench - 3x10", 
            tip: "Press dumbbells up overhead without arching lower back excessively.",
            dual: "👯 Grab dumbbells and set up two benches next to each other."
          },
          { 
            name: "Hip Abductor Machine", 
            detail: "Machine - 3x15", 
            tip: "Pause 1 second at wide extension to maximize glute medius activation.",
            dual: "👯 Quick set rotations on the machine."
          },
          { 
            name: "Treadmill HIIT Finisher", 
            detail: "Cardio Intervals - 12-15 Minutes", 
            tip: "1 min walk @ 3 mph / 30s incline walk or sprint @ 6-8%. Repeat for 8-10 rounds.",
            dual: "👯 Grab adjacent treadmills and match interval timers!"
          }
        ]
      }
    };

    let activeDay = 'mon_thu';

    function toggleTip(index) {
      const tipBox = document.getElementById(`tip-${index}`);
      tipBox.style.display = (tipBox.style.display === 'block') ? 'none' : 'block';
    }

    function switchDay(dayKey) {
      activeDay = dayKey;
      
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach((btn, index) => {
        if ((dayKey === 'mon_thu' && index === 0) || 
            (dayKey === 'tue' && index === 1) || 
            (dayKey === 'wed_fri' && index === 2)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderGym();
    }

    function renderGym() {
      const container = document.getElementById('gym-container');
      container.innerHTML = '';
      
      const currentSchedule = sharedSchedule[activeDay];

      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'category';
      sectionDiv.innerHTML = `
        <h3>${currentSchedule.title}</h3>
        <p class="focus-subtitle">${currentSchedule.focus}</p>
      `;
      
      currentSchedule.exercises.forEach((ex, idx) => {
        const card = document.createElement('div');
        card.className = 'exercise';
        card.innerHTML = `
          <div class="exercise-main">
            <div class="exercise-info">
              <h4>${ex.name}</h4>
              <p>${ex.detail}</p>
            </div>
            <div class="actions">
              <button class="tip-btn" onclick="toggleTip(${idx})">💡 Duo Tips</button>
            </div>
          </div>
          <div class="tooltip-box" id="tip-${idx}">
            <div><strong>Form & Technique:</strong> ${ex.tip}</div>
            <div class="dual-notes"><strong>Shared Flow:</strong> ${ex.dual}</div>
          </div>
        `;
        sectionDiv.appendChild(card);
      });

      container.appendChild(sectionDiv);
    }

    renderGym();
  </script>
</body>
</html>
